spring.application.name=payment-gateway-core
spring.config.import=optional:file:.env[.properties]

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:paymenti7}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:paymenti7}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}

spring.datasource.url=jdbc:postgresql://${GATEWAY_POSTGRES_HOST:localhost}:${GATEWAY_POSTGRES_PORT:5433}/${GATEWAY_POSTGRES_DB:paymenti7_gateway}
spring.datasource.username=${GATEWAY_POSTGRES_USER:paymenti7}
spring.datasource.password=${GATEWAY_POSTGRES_PASSWORD:paymenti7}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.baseline-on-migrate=false
spring.jpa.open-in-view=false
spring.data.redis.repositories.enabled=false

spring.rabbitmq.publisher-confirm-type=correlated

payment.gateway.merchant-events.queue=payment-gateway-core.merchant-cache-invalidation.v1
payment.gateway.merchant-events.dead-letter-exchange=payment-gateway-core.dlx
payment.gateway.merchant-events.dead-letter-queue=payment-gateway-core.merchant-cache-invalidation.v1.dlq
payment.gateway.merchant-events.retry.initial-interval=1s
payment.gateway.merchant-events.retry.multiplier=2.0
payment.gateway.merchant-events.retry.max-interval=4s
payment.gateway.merchant-events.deduplication-ttl=24h
payment.gateway.merchant-cache.ttl=10m
payment.gateway.merchant-cache.revision-ttl=24h
payment.gateway.merchant-service.base-url=${MERCHANT_SERVICE_URL:http://localhost:8080}
payment.gateway.merchant-service.timeout=1s
payment.gateway.outbox.polling-delay=5s
payment.gateway.outbox.batch-size=20
payment.gateway.outbox.publisher-confirmation-timeout=2s
payment.gateway.authorization-results.queue=payment-gateway-core.payment-authorization-completed.v1
payment.gateway.authorization-results.dead-letter-exchange=payment-gateway-core.authorization-results.dlx
payment.gateway.authorization-results.dead-letter-queue=payment-gateway-core.payment-authorization-completed.v1.dlq
payment.gateway.idempotency.retention=24h
payment.gateway.idempotency.cleanup-delay=1h
payment.gateway.idempotency.cleanup-batch-size=1000
payment.gateway.idempotency.processing-stale-after=1h
payment.gateway.idempotency.monitoring-delay=5m

management.endpoints.access.default=none
management.endpoint.health.access=read-only

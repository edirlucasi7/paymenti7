spring.application.name=payment-gateway-core
spring.config.import=optional:file:.env[.properties]

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:paymenti7}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:paymenti7}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}

payment.gateway.merchant-events.queue=payment-gateway-core.merchant-cache-invalidation.v1
payment.gateway.merchant-events.dead-letter-exchange=payment-gateway-core.dlx
payment.gateway.merchant-events.dead-letter-queue=payment-gateway-core.merchant-cache-invalidation.v1.dlq
payment.gateway.merchant-events.retry.initial-interval=1s
payment.gateway.merchant-events.retry.multiplier=2.0
payment.gateway.merchant-events.retry.max-interval=4s
payment.gateway.merchant-events.deduplication-ttl=24h
payment.gateway.merchant-cache.ttl=10m
payment.gateway.merchant-service.base-url=${MERCHANT_SERVICE_URL:http://localhost:8080}
payment.gateway.merchant-service.timeout=1s

management.endpoints.access.default=none
management.endpoint.health.access=read-only

spring.application.name=payment-authorization-service
spring.config.import=optional:file:.env[.properties]
server.port=${AUTHORIZATION_SERVICE_PORT:8100}

spring.datasource.url=jdbc:postgresql://${AUTHORIZATION_POSTGRES_HOST:localhost}:${AUTHORIZATION_POSTGRES_PORT:5434}/${AUTHORIZATION_POSTGRES_DB:paymenti7_authorization}
spring.datasource.username=${AUTHORIZATION_POSTGRES_USER:paymenti7}
spring.datasource.password=${AUTHORIZATION_POSTGRES_PASSWORD:paymenti7}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=false

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:paymenti7}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:paymenti7}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.publisher-confirm-type=correlated

payment.authorization.input.queue=payment-authorization-service.payment-requested.v1
payment.authorization.input.dead-letter-exchange=payment-authorization-service.dlx
payment.authorization.input.dead-letter-queue=payment-authorization-service.payment-requested.v1.dlq
payment.authorization.input.retry.initial-interval=1s
payment.authorization.input.retry.multiplier=2.0
payment.authorization.input.retry.max-interval=4s
payment.authorization.acquirers-order=SIMULATOR_A,SIMULATOR_B
payment.authorization.adapter-timeout=2s
payment.authorization.worker.polling-delay=500ms
payment.authorization.worker.batch-size=20
payment.authorization.worker.call-stale-after=5s
payment.authorization.outbox.polling-delay=1s
payment.authorization.outbox.batch-size=20
payment.authorization.outbox.publisher-confirmation-timeout=2s
payment.authorization.simulators.simulator-a.outcome=APPROVED
payment.authorization.simulators.simulator-a.delay=0ms
payment.authorization.simulators.simulator-b.outcome=APPROVED
payment.authorization.simulators.simulator-b.delay=0ms

payment.authorization.circuit-breaker.closed-window=30s
payment.authorization.circuit-breaker.minimum-calls=100
payment.authorization.circuit-breaker.open-failure-rate=50
payment.authorization.circuit-breaker.open-duration=60s
payment.authorization.circuit-breaker.probe-sample-percent=10
payment.authorization.circuit-breaker.maximum-concurrent-probes=20
payment.authorization.circuit-breaker.required-completed-probes=100
payment.authorization.circuit-breaker.recovery-success-rate=95
payment.authorization.circuit-breaker.minimum-recovery-observation=10s
payment.authorization.circuit-breaker.maximum-recovery-observation=2m

management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoint.metrics.access=read-only
management.endpoints.web.exposure.include=health,metrics
